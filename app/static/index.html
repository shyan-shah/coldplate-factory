<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loopwerks · autonomous test lab (demo)</title>
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M39 12 H40 A12 12 0 0 1 52 24 V40 A12 12 0 0 1 40 52 H24 A12 12 0 0 1 12 40 V24 A12 12 0 0 1 24 12 H22" fill="none" stroke="#5CC6D6" stroke-width="6"/><path d="M30 12 L21 4.5 V19.5 Z" fill="#5CC6D6"/><circle cx="37.5" cy="12" r="5" fill="#E59A2E"/></svg>
    <div>
      <div class="brand-name">loopwerks <span class="sub">test lab · demo</span></div>
      <div class="pitch">Agents plan the campaign from the standard. Robots run it. Results feed back. Rigs are mock; results are simulated.</div>
    </div>
  </div>
  <div class="top-right">
    <span id="mode-badge" class="badge">…</span>
    <span id="clock" class="clock"></span>
  </div>
</header>

<main class="layout">
  <!-- Left: request + history -->
  <section class="col col-left">
    <div class="panel">
      <div class="panel-h"><h2>Test request</h2>
        <select id="demo-select" aria-label="Load a demo request"></select>
      </div>
      <form id="spec-form" class="spec-form" autocomplete="off"></form>
      <div class="form-actions">
        <select id="mode-select" aria-label="Agent mode">
          <option value="">Mode: auto</option>
          <option value="live">Live agents (Claude)</option>
          <option value="scripted">Scripted replay</option>
        </select>
        <button id="submit-btn" class="btn primary" type="button">Submit to lab</button>
      </div>
    </div>
    <div class="panel grow">
      <div class="panel-h"><h2>Jobs</h2><button id="refresh-jobs" class="btn ghost small" type="button">Refresh</button></div>
      <ul id="job-list" class="job-list"></ul>
    </div>
  </section>

  <!-- Center: pipeline + live feed -->
  <section class="col col-center">
    <div class="panel pipeline-panel">
      <div class="panel-h"><h2 id="job-title">No job running</h2><span id="job-status" class="status-pill idle">idle</span></div>
      <div id="pipeline" class="pipeline"></div>
      <div id="kpis" class="kpis"></div>
    </div>
    <div class="panel grow feed-panel">
      <div class="panel-h"><h2>Agent activity</h2>
        <label class="toggle"><input type="checkbox" id="show-thinking" checked> reasoning</label>
        <label class="toggle"><input type="checkbox" id="autoscroll" checked> follow</label>
      </div>
      <div id="feed" class="feed" aria-live="polite"></div>
    </div>
  </section>

  <!-- Right: artifacts -->
  <section class="col col-right">
    <div class="panel grow">
      <nav id="tabs" class="tabs" role="tablist"></nav>
      <div id="tab-body" class="tab-body"></div>
    </div>
  </section>
</main>

<div id="gate" class="gate hidden" role="dialog" aria-label="Engineer approval">
  <div class="gate-inner">
    <div class="gate-left">
      <div class="gate-title"><span class="dot pulse"></span> Engineer release required</div>
      <div id="gate-summary" class="gate-summary"></div>
    </div>
    <div class="gate-actions">
      <input id="gate-comment" placeholder="Comment (optional)" aria-label="Approval comment">
      <button id="btn-return" class="btn ghost" type="button">Return to agents</button>
      <button id="btn-approve" class="btn approve" type="button">Release campaign to lab</button>
    </div>
  </div>
</div>
<div id="tooltip" class="tooltip hidden"></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
